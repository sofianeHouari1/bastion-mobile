name: APK Bastion
on: workflow_dispatch
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: subosito/flutter-action@v2
        with: { channel: stable }
      - name: Cle de signature stable (memes mises a jour sans desinstaller, liens des e-mails)
        env:
          KS: ${{ secrets.ANDROID_DEBUG_KEYSTORE_B64 }}
        run: |
          mkdir -p ~/.android
          if [ -n "$KS" ]; then echo "$KS" | base64 -d > ~/.android/debug.keystore; echo "cle : secret GitHub"
          elif [ -f bastion_mobile/android_res/signing/debug.keystore ]; then cp bastion_mobile/android_res/signing/debug.keystore ~/.android/debug.keystore; echo "cle : fichier du depot"
          else echo "pas de cle stable : signature aleatoire"; fi
      - name: Preparer le projet Android
        working-directory: bastion_mobile
        run: |
          flutter create . --platforms=android --project-name bastion_mobile --org fr.bastion
          python3 tools/patch_android.py
          flutter pub get
      - name: Corriger le plugin WebView (regle Gradle recente)
        run: |
          # Le plugin utilise une option que le Gradle recent refuse : on prend la variante demandee par le message d'erreur.
          for f in $(find ~/.pub-cache/hosted/pub.dev -path '*flutter_inappwebview_android*' -name build.gradle); do
            sed -i "s/proguard-android\.txt/proguard-android-optimize.txt/g" "$f"
            echo "corrige : $f"
          done
      - name: Analyse du code (informatif)
        working-directory: bastion_mobile
        run: flutter analyze || true
      - name: Construire
        working-directory: bastion_mobile
        run: flutter build apk --debug
      - uses: actions/upload-artifact@v4
        with:
          name: bastion-apk
          path: bastion_mobile/build/app/outputs/flutter-apk/app-debug.apk
