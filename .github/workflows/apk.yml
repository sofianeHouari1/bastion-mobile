name: APK Bastion
on: workflow_dispatch
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: subosito/flutter-action@v2
        with: { channel: stable }
      - name: Preparer le projet Android
        working-directory: bastion_mobile
        run: |
          flutter create . --platforms=android --project-name bastion_mobile --org fr.bastion
          python3 - <<'PY'
          p = 'android/app/src/main/AndroidManifest.xml'
          s = open(p).read()
          perms = ''.join('    <uses-permission android:name="android.permission.%s"/>\n' % x for x in ['INTERNET','CAMERA','RECORD_AUDIO','MODIFY_AUDIO_SETTINGS','ACCESS_NETWORK_STATE','BLUETOOTH_CONNECT','WAKE_LOCK'])
          s = s.replace('<application', perms + '    <application', 1)
          s = s.replace('android:label="bastion_mobile"', 'android:label="Bastion"')
          open(p, 'w').write(s)
          PY
          flutter pub get
      - name: Analyse du code (informatif)
        working-directory: bastion_mobile
        run: flutter analyze || true
      - name: Construire
        working-directory: bastion_mobile
        run: flutter build apk --debug
      - uses: actions/upload-artifact@v4
        with:
          name: bastion-apk
          path: bastion_mobile/build/app/outputs/flutter-apk/app-debug.apk
